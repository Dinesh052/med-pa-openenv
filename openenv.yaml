spec_version: 1
name: med_pa
type: space
runtime: fastapi
app: server.app:app
port: 8000
version: "1.0.0"
description: >
  Simulates insurance prior authorization review. An agent reviews PA
  requests against clinical guidelines and makes approve/deny/request_info
  decisions. Models the $50B+ US healthcare administrative burden.
  Tasks range from straightforward approvals to denial cases with buried
  contraindications in dense clinical notes.
author: Dinesh052
tags:
  - openenv
  - healthcare
  - prior-authorization
  - agentic
  - reinforcement-learning
tasks:
  - easy_knee_mri
  - easy_chest_xray
  - easy_pt_eval
  - medium_humira
  - medium_ozempic
  - medium_sleep_study
  - hard_spinal_fusion
  - hard_cardiac_cath
  - hard_gene_therapy
difficulty_levels:
  - easy
  - medium
  - hard
